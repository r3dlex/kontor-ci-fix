name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  _mix-audit-self-hosted:
    name: "Mix Audit (advisory, self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    env:
      MIX_ENV: dev
      # setup-beam cannot infer the target OS on a self-hosted runner and
      # aborts with "Tried to map a target OS from env. variable 'ImageOS'
      # (got undefined)".
      ImageOS: ubuntu24
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Mix and Hex state
        run: |
          # r3dlex-runner-3 and r3dlex-runner-4 are two runner instances on one
          # host that share a single $HOME, so concurrent `mix local.hex
          # --force` runs (setup-beam installs Hex and Rebar by default) corrupt
          # the shared Hex archive. Give every job its own MIX_HOME/HEX_HOME.
          echo "MIX_HOME=$RUNNER_TEMP/mix" >> "$GITHUB_ENV"
          echo "HEX_HOME=$RUNNER_TEMP/hex" >> "$GITHUB_ENV"
          # setup-beam merges into a stale $RUNNER_TEMP/.setup-beam tree, whose
          # leftover OTP can shadow the one it just installed.
          rm -rf "$RUNNER_TEMP/.setup-beam"
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Restore deps cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Check for vulnerable dependencies (advisory)
        run: |
          # The audit is ADVISORY. The dependency tree currently carries known
          # advisories, and turning this into a hard gate is a maintainer
          # decision that needs those advisories resolved first. What must not
          # happen is a check that reads as "the tree is clean" while the audit
          # underneath it exits non-zero, so the failure is reported as a
          # warning annotation instead of being swallowed by `continue-on-error`.
          set +e
          audit_output="$(mix deps.audit 2>&1)"
          audit_status=$?
          set -e
          echo "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning title=Mix Audit (advisory)::mix deps.audit exited $audit_status — the dependency tree has known advisories. This check is advisory and does not fail the build."
            {
              echo "### Mix Audit (advisory)"
              echo ""
              echo '```'
              echo "$audit_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  mix-audit:
    name: Mix Audit (advisory)
    needs: _mix-audit-self-hosted
    if: always()
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._mix-audit-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._mix-audit-self-hosted.outputs.passed != 'true'
      - name: Set up Elixir
        if: needs._mix-audit-self-hosted.outputs.passed != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Restore deps cache
        if: needs._mix-audit-self-hosted.outputs.passed != 'true'
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        if: needs._mix-audit-self-hosted.outputs.passed != 'true'
        run: mix deps.get
      - name: Check for vulnerable dependencies (advisory)
        if: needs._mix-audit-self-hosted.outputs.passed != 'true'
        run: |
          # The audit is ADVISORY. The dependency tree currently carries known
          # advisories, and turning this into a hard gate is a maintainer
          # decision that needs those advisories resolved first. What must not
          # happen is a check that reads as "the tree is clean" while the audit
          # underneath it exits non-zero, so the failure is reported as a
          # warning annotation instead of being swallowed by `continue-on-error`.
          set +e
          audit_output="$(mix deps.audit 2>&1)"
          audit_status=$?
          set -e
          echo "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning title=Mix Audit (advisory)::mix deps.audit exited $audit_status — the dependency tree has known advisories. This check is advisory and does not fail the build."
            {
              echo "### Mix Audit (advisory)"
              echo ""
              echo '```'
              echo "$audit_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  _npm-audit-self-hosted:
    name: "NPM Audit (advisory, self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    defaults:
      run:
        working-directory: frontend
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (advisory)
        run: |
          # The audit is ADVISORY. The frontend dependency tree currently
          # carries known advisories, and turning this into a hard gate is a
          # maintainer decision that needs those advisories resolved first.
          # What must not happen is a check that reads as "the tree is clean"
          # while the audit underneath it exits non-zero, so the failure is
          # reported as a warning annotation instead of being swallowed by
          # `continue-on-error`.
          set +e
          audit_output="$(npm audit --audit-level=high 2>&1)"
          audit_status=$?
          set -e
          echo "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning title=NPM Audit (advisory)::npm audit --audit-level=high exited $audit_status — the frontend dependency tree has known advisories. This check is advisory and does not fail the build."
            {
              echo "### NPM Audit (advisory)"
              echo ""
              echo '```'
              echo "$audit_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: mark
        if: success()
        working-directory: ${{ github.workspace }}
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  npm-audit:
    name: NPM Audit (advisory)
    needs: _npm-audit-self-hosted
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Route
        working-directory: ${{ github.workspace }}
        run: echo "self-hosted passed=${{ needs._npm-audit-self-hosted.outputs.passed }}"
      - uses: actions/checkout@v4
        if: needs._npm-audit-self-hosted.outputs.passed != 'true'
      - name: Set up Node
        if: needs._npm-audit-self-hosted.outputs.passed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        if: needs._npm-audit-self-hosted.outputs.passed != 'true'
        run: npm ci
      - name: Run npm audit (advisory)
        if: needs._npm-audit-self-hosted.outputs.passed != 'true'
        run: |
          # The audit is ADVISORY. The frontend dependency tree currently
          # carries known advisories, and turning this into a hard gate is a
          # maintainer decision that needs those advisories resolved first.
          # What must not happen is a check that reads as "the tree is clean"
          # while the audit underneath it exits non-zero, so the failure is
          # reported as a warning annotation instead of being swallowed by
          # `continue-on-error`.
          set +e
          audit_output="$(npm audit --audit-level=high 2>&1)"
          audit_status=$?
          set -e
          echo "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning title=NPM Audit (advisory)::npm audit --audit-level=high exited $audit_status — the frontend dependency tree has known advisories. This check is advisory and does not fail the build."
            {
              echo "### NPM Audit (advisory)"
              echo ""
              echo '```'
              echo "$audit_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
