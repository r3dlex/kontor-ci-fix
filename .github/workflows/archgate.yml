name: Archgate ADR Governance

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  _archgate-self-hosted:
    name: "ADR Compliance Check (self-hosted)"
    runs-on: [self-hosted, ubuntu-latest]
    continue-on-error: true
    outputs:
      passed: ${{ steps.mark.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      # The self-hosted Linux/ARM64 runners ship archgate 0.60.0 on PATH.
      # `archgate/setup-action` cannot be used here: upstream publishes no
      # linux/arm64 release and the installer aborts with
      # "Error: Linux is only supported on x86_64.".
      - name: Run Archgate
        run: .github/scripts/archgate-check.sh

      - id: mark
        if: success()
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  archgate:
    name: ADR Compliance Check
    needs: _archgate-self-hosted
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Route
        run: echo "self-hosted passed=${{ needs._archgate-self-hosted.outputs.passed }}"

      - uses: actions/checkout@v4
        if: needs._archgate-self-hosted.outputs.passed != 'true'

      # Same pinned version as the self-hosted leg, so both legs evaluate the
      # same rule set.
      - name: Install Archgate
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        uses: archgate/setup-action@b59adbe1ed404916ee60e1d558766718d5e3076c # v1
        with:
          version: v0.60.0

      - name: Run Archgate
        if: needs._archgate-self-hosted.outputs.passed != 'true'
        run: .github/scripts/archgate-check.sh
