  _build-linux_x86-self-hosted:
    name: "Build linux_x86 (self-hosted)"
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: [self-hosted, ubuntu-latest]
    # setup-beam cannot infer the target OS on a self-hosted runner and
    # aborts with "Tried to map a target OS from env. variable 'ImageOS'
    # (got undefined)".
    env:
      ImageOS: ubuntu24
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Mix and Hex state
        run: |
          # r3dlex-runner-3 and r3dlex-runner-4 are two runner instances on
          # ONE host that share ONE $HOME, so concurrent `mix local.hex
          # --force` runs (setup-beam installs Hex and Rebar by default)
          # corrupt the shared Hex archive. Give every job its own
          # MIX_HOME/HEX_HOME.
          echo "MIX_HOME=$RUNNER_TEMP/mix" >> "$GITHUB_ENV"
          echo "HEX_HOME=$RUNNER_TEMP/hex" >> "$GITHUB_ENV"
