            exit 1
          fi
          echo "passed=true" >> "$GITHUB_OUTPUT"

  # ── Tier 2: gate router ───────────────────────────────────────────────────
  # One gate per target reads the corresponding probe result.
  _build-macos_arm-gate:
    name: "Build macos_arm (gate)"
    needs: [_build-macos_arm-self-hosted]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check self-hosted outcome
        id: check
        run: |
          if [ "${{ needs._build-macos_arm-self-hosted.outputs.passed }}" = "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

  _build-macos_x86-gate:
    name: "Build macos_x86 (gate)"
    needs: [_build-macos_x86-self-hosted]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check self-hosted outcome
        id: check
        run: |
          if [ "${{ needs._build-macos_x86-self-hosted.outputs.passed }}" = "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

  _build-linux_x86-gate:
    name: "Build linux_x86 (gate)"
    needs: [_build-linux_x86-self-hosted]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Check self-hosted outcome
        id: check
        run: |
          if [ "${{ needs._build-linux_x86-self-hosted.outputs.passed }}" = "true" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Tier 3: canonical GH-hosted fallback per target ───────────────────────
  # Run only when the corresponding self-hosted probe did not pass.
  # The job *name* ("Build ${{matrix.target}}") and the matrix `include:` block
  # are preserved from the base workflow so the tag-release artifact name and
  # BURRITO_TARGET chain stay identical. Branch protection watches job names,
  # so keeping them stable matters if this workflow is upstreamed into a
  # protected repository — this repository itself has no branch protection
  # (`gh api repos/…/branches/main/protection` returns 404), so nothing here
  # gates a merge on these names today.
  build:
    name: Build ${{ matrix.target }}
    needs: [_build-macos_arm-gate, _build-macos_x86-gate, _build-linux_x86-gate]
    if: always()
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos_arm
            artifact_name: kontor-macos-arm
            sh_passed: ${{ needs._build-macos_arm-gate.outputs.passed }}
          - os: macos-latest
            target: macos_x86
            artifact_name: kontor-macos-x86
            sh_passed: ${{ needs._build-macos_x86-gate.outputs.passed }}
          - os: ubuntu-latest
            target: linux_x86
            artifact_name: kontor-linux-x86
            sh_passed: ${{ needs._build-linux_x86-gate.outputs.passed }}
    env:
      MIX_ENV: prod
    steps:
      - name: Route
        run: |
          if [ "${{ matrix.sh_passed }}" = "true" ]; then
            echo "Self-hosted leg for ${{ matrix.target }} passed — GH-hosted fallback skipped."
          else
            echo "Self-hosted leg for ${{ matrix.target }} did not pass — running GH-hosted fallback."
          fi
      - uses: actions/checkout@v4
        if: matrix.sh_passed != 'true'
      - name: Set up Elixir
        if: matrix.sh_passed != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - name: Ensure xz is available
        if: matrix.sh_passed != 'true'
        run: |
          # setup-zig extracts the zig tarball with `tar -xJ`, and burrito's
          # pre_check/0 requires `xz` on PATH, so xz has to be in place before
          # the zig step runs.
          if ! command -v xz >/dev/null 2>&1; then
            for dir in /opt/homebrew/opt/xz/bin /usr/local/opt/xz/bin /opt/homebrew/bin /usr/local/bin; do
              if [ -x "$dir/xz" ]; then
                echo "$dir" >> "$GITHUB_PATH"
                export PATH="$dir:$PATH"
                break
              fi
            done
          fi
          if ! command -v xz >/dev/null 2>&1; then
            echo "::error::xz is not on PATH — setup-zig and burrito both require it"
            exit 1
          fi
          echo "xz: $(command -v xz)"
      - name: Install Zig
        if: matrix.sh_passed != 'true'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.15.2"
          use-cache: false
          use-tool-cache: false
      - name: Verify the burrito build prerequisites
        if: matrix.sh_passed != 'true'
        run: |
          # burrito 1.5.0 aborts `mix release` when zig is not exactly
          # 0.15.2. Check it before the build so the failure names the
          # version instead of surfacing as a bare release-step abort.
          zig_version="$(zig version 2>/dev/null || true)"
          if [ "$zig_version" != "0.15.2" ]; then
            echo "::error::burrito 1.5.0 requires zig 0.15.2 exactly; found '${zig_version:-no zig on PATH}'"
            exit 1
          fi
          echo "zig $zig_version"
      - name: Restore deps cache
        if: matrix.sh_passed != 'true'
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-prod-
      - name: Install dependencies
        if: matrix.sh_passed != 'true'
        run: mix deps.get --only prod
      - name: Build release
        if: matrix.sh_passed != 'true'
        run: MIX_ENV=prod mix release
        env:
          BURRITO_TARGET: ${{ matrix.target }}
      - name: Upload artifact
        if: matrix.sh_passed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: burrito_out/*${{ matrix.target }}*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
