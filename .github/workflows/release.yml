          name: kontor-macos-x86
          path: burrito_out/*macos_x86*
          if-no-files-found: error
      - name: Gate
        id: gate
        if: success()
        env:
          BURRITO_TARGET: macos_x86
        run: |
          # Burrito writes burrito_out/<release>_<target> (kontor_macos_x86).
          # The upload above already fails the job when it finds nothing; this
          # asserts the same thing before the leg may claim it passed.
          if ! ls burrito_out/*"${BURRITO_TARGET}"* >/dev/null 2>&1; then
